name: CID security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Need PR base commit available for check-cid-unchanged worktree.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf
          components: rustfmt, clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 libssl-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check bundled xUDT binary
        run: echo 'e9b92e5783f692f6ee99ca20eeda5f3da282e0f4010eb4fbd3db4e3058239349  tests/binaries/xudt' | sha256sum --check
      - name: Host default check
        run: cargo check --locked
      - name: Host default build
        run: cargo build --locked
      - name: Build RISC-V contract
        run: make build CLANG=clang-18 CARGO_ARGS=--locked
      # Absolute pin (CID_LOCK_SHA256) is deploy/agent-env specific; GHA ubuntu
      # produces a different hash for the same source. On PRs, rebuild the base
      # ref with the same toolchain and require a byte-identical CID lock.
      - name: Guard CID lock binary unchanged vs PR base
        if: github.event_name == 'pull_request'
        run: make check-cid-unchanged BASE_SHA=${{ github.event.pull_request.base.sha }} CLANG=clang-18 CARGO_ARGS=--locked
      - name: Guard CID lock binary hash (absolute pin)
        if: github.event_name != 'pull_request'
        run: make check-cid-hash
      - name: Host default tests
        run: cargo test --locked
      - name: Lint host crates
        run: cargo clippy --locked -p cid-protocol -p cid-intention-filter -p ckb_common_intention_dispatcher-calculator -p cid_process_example-calculator -p cid-process-executor -p ckb_common_intention_dispatcher-tests -p cid-intention-cli --all-targets -- -D warnings
      - name: Protocol tests
        run: cargo test --locked -p cid-protocol
      - name: Intention filter / route tests
        run: cargo test --locked -p cid-intention-filter
      - name: Intention CLI tests
        run: cargo test --locked -p cid-intention-cli
      - name: Lint contract
        env:
          TARGET_CC: clang-18
        run: cargo clippy --locked -p ckb_common_intention_dispatcher --target riscv64imac-unknown-none-elf -- -D warnings
      - name: CKB-VM security regression tests
        run: make test CARGO_ARGS=--locked
      - name: Record contract binary hash
        run: sha256sum build/release/ckb_common_intention_dispatcher > build/release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cid-contract
          path: |
            build/release/ckb_common_intention_dispatcher
            build/release/SHA256SUMS
