[workspace]
resolver = "2"

# Host-first defaults: plain `cargo check/build/test` at the root must not try to
# link RISC-V no_std contract bins for the host target, and must not pull the
# optional Cinnabar deploy CLI (OpenSSL / indexer) into every developer build.
default-members = [
  "protocol",
  "calculator/intention",
  "calculator/process",
  "crates/cid-process-executor",
]

members = [
  "protocol",
  "calculator/intention",
  "calculator/process",
  "tests",
  "contracts/ckb_common_intention_dispatcher",
  "contracts/cid_process_example",
  "crates/cid-process-executor",
  "runner",
]

[workspace.dependencies]
ckb-cinnabar = { git = "https://github.com/ashuralyk/ckb-cinnabar", rev = "7187a50ea8eebef5ebea68ac0d6e223a64b08ebf" }
ckb-cinnabar-calculator = { git = "https://github.com/ashuralyk/ckb-cinnabar", rev = "7187a50ea8eebef5ebea68ac0d6e223a64b08ebf" }
ckb-cinnabar-verifier = { git = "https://github.com/ashuralyk/ckb-cinnabar", rev = "7187a50ea8eebef5ebea68ac0d6e223a64b08ebf" }
ckb-ssri-std = { git = "https://github.com/ashuralyk/ckb-ssri-std", rev = "8c2c245" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 's'
overflow-checks = true
strip = true
