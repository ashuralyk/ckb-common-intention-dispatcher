[workspace]
resolver = "2"

members = [
  # @@INSERTION_POINT@@
  "protocol",
  "calculator",
  "tests",
  "contracts/ckb_common_intention_dispatcher",
]

[workspace.dependencies]
# Using local cinnabar with OffchainTransactionDependencyProvider fix
# (populated with skeleton input cells for FakeRpc signing)
# TODO: Submit upstream PR or use published version once available
ckb-cinnabar = { path = "/tmp/ckb-cinnabar-fix" }
ckb-cinnabar-calculator = { path = "/tmp/ckb-cinnabar-fix/calculate" }
ckb-cinnabar-verifier = { path = "/tmp/ckb-cinnabar-fix/verify" }

[package]
edition = "2021"
name = "ckb_common_intention_dispatcher-runner"
version = "0.1.0"

[dependencies]
ckb-cinnabar = { workspace = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 's'
overflow-checks = true
strip = true
